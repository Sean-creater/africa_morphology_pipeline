name: africa_morphology_metrics
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - geopandas>=0.14
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.6
  - rtree>=1.0
  - rasterio>=1.3
  - momepy>=0.7
  - networkx>=3.0
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - libpysal>=4.9
  - tqdm>=4.65
  - requests>=2.28
  # OSM PBF reading: pyogrio (primary, GDAL-backed) with pyrosm as fallback
  - pyogrio>=0.7
  - pyrosm>=0.6
  # Optional but strongly recommended: enables the faster igraph-backed
  # connectivity path (africa_morphology_metrics.connectivity). Falls back
  # to pure NetworkX automatically if unavailable.
  - python-igraph>=0.11
  - pip
  - pip:
      - pydantic>=2.0.0
      - gcsfs>=2023.10.0
      - fsspec>=2023.10.0
      - google-cloud-storage>=2.10.0
      - google-auth>=2.15.0
      - s2sphere>=0.2.5
