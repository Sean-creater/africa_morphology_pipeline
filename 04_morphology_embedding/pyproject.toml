[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "africa-morphology-embedding"
version = "1.0.0"
description = "Six methods for embedding African urban morphology (250m hex grid cells), compared against expert pairwise-similarity annotations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["methods*", "shared*"]
